name: Tests

on:
  push:
    branches: [0.x]
  pull_request:
    branches: [0.x]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            dependencies: latest
          - php: '8.5'
            dependencies: latest
          - php: '8.4.1'
            dependencies: lowest

    name: PHP ${{ matrix.php }} / Laravel 13 / ${{ matrix.dependencies }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl
          coverage: none

      - name: Install latest dependencies
        if: matrix.dependencies == 'latest'
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Install lowest dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Validate package
        run: composer validate --strict

      - name: Run tests
        run: composer test

  quality:
    name: Code quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: composer lint

      - name: Analyse code
        run: composer analyse
